  <body>
    <div id="root"></div>

  </body>
  <script>
  (function () {
    const saved = localStorage.getItem("theme");
    const theme =
      saved ||
      (window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light");
    document.documentElement.classList.toggle("dark", theme === "dark");
  })();
</script>
</html>
